
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Chuyển Khoản MB Bank</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #dff1ff, #ffffff);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        input, select, button, a.app-link {
            padding: 12px;
            font-size: 16px;
            width: 100%;
            margin: 10px 0;
            border-radius: 10px;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        input, select {
            border: 1px solid #ccc;
        }
        button {
            background-color: #003e90;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0055cc;
        }
        #qr img {
            margin-top: 20px;
            width: 100%;
            max-width: 300px;
        }
        .app-link {
            background-color: #eee;
            color: #003e90;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <p><strong>Người nhận:</strong> HOANG GIA PHUC</p>
        <p><strong>Ngân hàng:</strong> MB Bank - STK: 386888886868</p>
        <input type="number" id="amount" placeholder="Nhập số tiền (VND)">
        <select id="note">
            <option value="Chúc quý khách ngon miệng ạ!!!!" selected>Chúc quý khách ngon miệng ạ!!!!</option>
            <option value="Cảm ơn bác tài xế nhiềuuuuu">Cảm ơn bác tài xế nhiềuuuuu</option>
            <option value="Cảm ơn quý khách rất nhiều!!!">Cảm ơn quý khách rất nhiều!!!</option>
        </select>
        <button onclick="generateQR()">Chuyển đến ngân hàng hiện có trong máy của quý khách</button>
        <div id="qr"></div>
        <div id="appButtons">
            <a class="app-link" href="mbbank://" target="_blank">Mở ứng dụng MB Bank</a>
            <a class="app-link" href="momo://app" target="_blank">Mở ví MoMo</a>
            <a class="app-link" href="zalopay://" target="_blank">Mở ZaloPay</a>
            <a class="app-link" href="#" onclick="alert('Vietcombank hiện chưa hỗ trợ mở app qua trình duyệt'); return false;">Mở Vietcombank</a>
        </div>
    </div>

    <script>
        function generateQR() {
            const amount = document.getElementById("amount").value;
            const note = document.getElementById("note").value;
            const stk = "386888886868";
            const bank = "MB";
            const accountName = "HOANG GIA PHUC";

            if (!amount || amount <= 0) {
                alert("Vui lòng nhập số tiền hợp lệ!");
                return;
            }

            const encodedNote = encodeURIComponent(note);
            const encodedName = encodeURIComponent(accountName);
            const qrURL = `https://img.vietqr.io/image/${bank}-${stk}-compact2.png?amount=${amount}&addInfo=${encodedNote}&accountName=${encodedName}`;

            document.getElementById("qr").innerHTML = `
                <p><strong>Mã QR của bạn:</strong></p>
                <img src="${qrURL}" alt="QR Code">
                <p><a href="${qrURL}" target="_blank">Mở ảnh QR trong tab mới</a></p>
            `;
        }
    </script>
</body>
</html>
